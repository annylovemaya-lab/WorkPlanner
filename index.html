<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F0F0F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1829" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Планер</title>
<style>
:root{
  --lilac:#D0ADC4; --purple:#736EAE; --grey:#F0F0F0; --peach:#FCE5CC;
  --bg:#F0F0F0; --card:#FFFFFF; --cell:#F0F0F0; --panel:#FCE5CC; --row:#FFFFFF;
  --ink:#2C2845; --muted:#6B6784; --accent:#736EAE; --accent-ink:#FFFFFF; --soft:#D0ADC4; --soft-ink:#2C2845;
  --cs:7; --ps:5; --mw:1440px; --z:1; --rm:1; --cellh:116px; --rpy:12px;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --line:color-mix(in srgb,var(--accent) 22%,transparent);
  --shadow:0 1px 2px rgba(115,110,174,.08),0 8px 24px rgba(115,110,174,.07);
  --p3-bg:#FFE4E6; --p3-fg:#BE123C; --p3-bar:#F43F5E;
  --p2-bg:#FCE5CC; --p2-fg:#7A4F25; --p2-bar:#E5C39E;
  --p1-bg:#ECDEE7; --p1-fg:#2D2B38; --p1-bar:#D0ADC4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1829; --card:#26223A; --cell:#312B49; --panel:#372E50; --row:#443A60;
    --ink:#F0F0F0; --muted:#B9B4D2; --line:rgba(208,173,196,.24);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1829; --card:#26223A; --cell:#312B49; --panel:#372E50; --row:#443A60;
  --ink:#F0F0F0; --muted:#B9B4D2; --line:rgba(208,173,196,.24);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p3-bg:#5C2438;--p3-fg:#FFC2D0;--p2-bg:#5A4532;--p2-fg:#FCE5CC;--p1-bg:#4B3F5E;--p1-fg:#E8D5E1}}
:root[data-theme="dark"]{--p3-bg:#5C2438;--p3-fg:#FFC2D0;--p2-bg:#5A4532;--p2-fg:#FCE5CC;--p1-bg:#4B3F5E;--p1-fg:#E8D5E1}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);zoom:var(--z);
  font-family:var(--font);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- каркас ---------- */
.app{max-width:var(--mw);margin:0 auto;padding:20px 24px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--card);border-radius:calc(28px*var(--rm));padding:16px 22px;box-shadow:var(--shadow);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.bt{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdate{margin:2px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.hright{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo-mark{width:48px;height:48px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 6px 14px rgba(115,110,174,.3)}
.grow{flex:1}
.layout{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.layout>.cal{grid-column:span var(--cs)}
.layout>.panel{grid-column:span var(--ps)}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:600;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover,.btn-soft:hover{filter:brightness(.93)}
.btn-soft{background:var(--soft);color:var(--soft-ink)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--cell);color:var(--ink)}
.btn-sm{padding:8px 15px;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:var(--cell);font-size:18px;transition:background .15s}
.icon-btn:hover{background:var(--soft);color:var(--soft-ink)}

/* ---------- календарь ---------- */
.cal{background:var(--card);border-radius:calc(32px*var(--rm));padding:24px;box-shadow:var(--shadow)}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.cal-head h1{margin:0 10px 0 0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.wdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wdays div{text-align:center;color:var(--muted);font-weight:600;font-size:13px;padding:0 0 8px}
.cell{
  position:relative;background:var(--cell);border-radius:calc(20px*var(--rm));padding:9px 9px 8px;min-height:var(--cellh);
  display:flex;flex-direction:column;gap:5px;cursor:pointer;transition:box-shadow .15s,background .15s;min-width:0;
}
.cell:hover{box-shadow:0 0 0 2px var(--soft)}
.cell.out{background:transparent;opacity:.5}
.cell.sel{background:var(--card);box-shadow:0 0 0 3px var(--accent)}
.cell-top{display:flex;align-items:center;justify-content:space-between;min-height:28px}
.num{font-weight:700;font-size:15px;min-width:28px;height:28px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.cell.today .num{background:var(--accent);color:var(--accent-ink)}
.add{width:26px;height:26px;border-radius:999px;background:var(--soft);color:var(--soft-ink);display:grid;place-items:center;font-size:14px;opacity:0;transition:opacity .15s}
.cell:hover .add,.cell.sel .add{opacity:1}
.chips{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{display:flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.chip span.t{overflow:hidden;text-overflow:ellipsis}
.chip.p3{background:var(--p3-bg);color:var(--p3-fg)}
.chip.p2{background:var(--p2-bg);color:var(--p2-fg)}
.chip.p1{background:var(--p1-bg);color:var(--p1-fg)}
.chip.done{opacity:.5}
.chip.done .t{text-decoration:line-through}
.more{font-size:12px;color:var(--muted);font-weight:600;padding-left:6px}
.dots{display:none;gap:4px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:999px}
.dot.p3{background:var(--p3-bar)}.dot.p2{background:var(--p2-bar)}.dot.p1{background:var(--p1-bar)}
.dot.done{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:20px;color:var(--muted);font-size:13px;align-items:center}
.legend .lg{display:inline-flex;align-items:center;gap:7px}
.legend .dot{width:12px;height:12px}

/* ---------- сводка ---------- */
.panel{background:var(--panel);border-radius:calc(32px*var(--rm));padding:22px;box-shadow:var(--shadow);position:sticky;top:16px;max-height:calc((100dvh - 32px)/var(--z));overflow:auto}
.p-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.p-top h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.p-top p{margin:2px 0 0;color:var(--muted);font-weight:500}
.p-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px;flex-wrap:wrap}
.tabs{display:inline-flex;background:rgba(255,255,255,.55);border-radius:999px;padding:4px}
:root[data-theme="dark"] .tabs{background:rgba(255,255,255,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs{background:rgba(255,255,255,.08)}}
.tabs button{padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.nav{display:flex;gap:6px;align-items:center}
.nav .icon-btn{width:36px;height:36px;background:var(--row)}
.nav .icon-btn:hover{background:var(--soft)}
.progress{margin-bottom:16px}
.progress .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.bar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.list{display:flex;flex-direction:column;gap:9px}
.row{position:relative;display:flex;align-items:flex-start;gap:12px;background:var(--row);border-radius:calc(22px*var(--rm));padding:var(--rpy) 14px var(--rpy) 20px}
.row::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:5px;border-radius:999px}
.row.p3::before{background:var(--p3-bar)}
.row.p2::before{background:var(--p2-bar)}
.row.p1::before{background:var(--p1-bar)}
.check{width:30px;height:30px;border-radius:999px;border:2.5px solid var(--accent);display:grid;place-items:center;color:transparent;flex:none;margin-top:1px;transition:background .15s,color .15s}
.check:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.row.done .check{background:var(--accent);color:var(--accent-ink)}
.row.pop .check{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.main{flex:1;min-width:0;cursor:pointer;border-radius:12px}
.ttl{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15.5px;line-height:1.3}
.ttl .ti{color:var(--accent);display:grid}
.ttl .tt{overflow-wrap:anywhere}
.ttl .rp{color:var(--muted);font-size:13px}
.row.done .tt{text-decoration:line-through;color:var(--muted)}
.row.done .main{opacity:.65}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;margin-top:3px;font-weight:500}
.meta .m{display:inline-flex;align-items:center;gap:5px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--soft-ink)}
.badge.od{background:var(--p3-bg);color:var(--p3-fg)}
.badge.due{background:var(--p2-bg);color:var(--p2-fg)}
.btn .badge{background:var(--accent);color:var(--accent-ink)}
.olines{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.oi{background:var(--cell);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.note{color:var(--muted);font-size:13px;margin-top:5px;overflow-wrap:anywhere}
.pchip{align-self:flex-start;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pchip.p3{background:var(--p3-bg);color:var(--p3-fg)}
.pchip.p2{background:var(--p2-bg);color:var(--p2-fg)}
.pchip.p1{background:var(--p1-bg);color:var(--p1-fg)}
.sub{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-weight:700;font-size:13.5px;color:var(--muted)}
.sub .badge{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink)}
.dayblock+.dayblock{margin-top:16px}
.dayhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;border-radius:999px;margin-bottom:8px}
.dayhead:hover{background:rgba(255,255,255,.5)}
.dayhead .dn{font-weight:800;font-size:15px}
.dayhead .dd{color:var(--muted);font-size:13.5px;font-weight:500}
.dayhead .cnt{margin-left:auto;font-size:12.5px;font-weight:700;background:var(--row);border-radius:999px;padding:2px 11px}
.dayhead.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 11px}
.free{color:var(--muted);font-size:13.5px;padding:2px 10px 4px}
.empty{text-align:center;padding:26px 10px 14px}
.empty .big{width:64px;height:64px;border-radius:24px;background:var(--row);color:var(--accent);display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.empty p{margin:0 0 14px;color:var(--muted);font-weight:500}

/* ---------- диалог ---------- */
dialog{border:0;padding:0;border-radius:calc(32px*var(--rm));width:min(580px,calc((100vw - 24px)/var(--z)));max-height:calc((100dvh - 24px)/var(--z));background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(44,40,69,.35);overflow:hidden}
dialog[open]{display:flex}
dialog::backdrop{background:rgba(44,40,69,.5);backdrop-filter:blur(3px)}
#frm{display:flex;flex-direction:column;width:100%;min-height:0;max-height:calc((100dvh - 24px)/var(--z))}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 8px}
.d-head h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.d-body{padding:8px 24px 12px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.d-foot{display:flex;align-items:center;gap:10px;padding:14px 24px 22px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:var(--cell);border:2px solid transparent;border-radius:16px;padding:11px 14px;outline:none;transition:border-color .15s
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:62px}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23736EAE' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:40px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label,.chipcheck{position:relative;cursor:pointer}
.seg input,.chipcheck input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span,.chipcheck span{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;background:var(--cell);font-weight:600;font-size:14px;transition:background .15s,color .15s}
.seg input:checked+span,.chipcheck input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span,.chipcheck input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.seg.prio .dot{width:11px;height:11px}
.seg.prio input:checked+span .dot{box-shadow:0 0 0 2px #fff}
.seg.wd span{padding:8px 0;width:44px;justify-content:center}
.box{background:var(--cell);border-radius:calc(24px*var(--rm));padding:16px;display:flex;flex-direction:column;gap:14px}
.box input[type=text],.box input[type=date],.box input[type=time],.box input[type=number],.box select,.box textarea{background:var(--card)}
.box .seg span,.box .chipcheck span{background:var(--card)}
.box .seg input:checked+span,.box .chipcheck input:checked+span{background:var(--accent)}
.inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inline input[type=number]{width:84px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 88px 40px;gap:8px;align-items:center}
.orow+.orow{margin-top:8px}
.dchips{display:flex;flex-wrap:wrap;gap:7px}
.dchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 6px 5px 13px;font-weight:600;font-size:13.5px}
.dchip button{width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,.25);color:var(--accent-ink);display:grid;place-items:center;font-size:12px}
.hint{color:var(--muted);font-size:13px;margin:0}
.err{margin:0;color:#8C3B6B;font-weight:600;font-size:14px;min-height:0}
:root[data-theme="dark"] .err{color:#F0B9DB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#F0B9DB}}
.err:empty{display:none}
.btn-del.confirm{background:var(--soft);color:var(--soft-ink)}

/* ---------- развёрнутый день ---------- */
#dayDlg{width:calc(100vw/var(--z));max-width:calc(100vw/var(--z));height:calc(100dvh/var(--z));max-height:calc(100dvh/var(--z));margin:0;border-radius:0;box-shadow:none}
#dayDlg::backdrop{background:var(--card)}
.dd-wrap{display:flex;flex-direction:column;width:100%;max-width:1100px;margin:0 auto;height:100%;min-height:0;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:900px){.dd-head{padding-top:28px}.dd-wrap .d-body{padding-left:32px;padding-right:32px}.dd-head{padding-left:32px;padding-right:32px}}
.dd-head{align-items:flex-start;gap:12px;flex-wrap:wrap}
.dd-head h3{font-size:28px;letter-spacing:-.03em}
.dd-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-top .icon-btn{background:var(--row)}
.p-top .icon-btn:hover{background:var(--soft)}
.p-top{flex-wrap:wrap}
.p-top>div:first-child{flex:1 1 150px;min-width:0}
.p-top .dd-actions{margin-left:auto;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px}
.p-top .dd-actions .btn{white-space:nowrap}
.dd-wrap .d-body{padding-bottom:24px;gap:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.stat{background:var(--cell);border-radius:22px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:22px;color:var(--accent)}
.stat b{font-size:24px;font-weight:800;line-height:1;color:var(--ink);display:block}
.stat small{font-size:13px;font-weight:600;color:var(--muted)}
#dayDlg .progress{margin-bottom:0}
#dayDlg .bar{background:var(--cell)}
#dayDlg .row{background:var(--cell)}
#dayDlg .oi{background:var(--card)}
#dayDlg .sub{margin:0 2px 10px}
#dayDlg .sub .badge{background:var(--soft);color:var(--soft-ink)}
.tl .hrow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;min-height:38px;border-top:1px solid var(--line);padding:6px 0}
.tl .hlab{color:var(--muted);font-weight:700;font-size:13px;padding-top:7px}
.tl .hrow.now{border-top:2px solid var(--accent)}
.tl .hrow.now .hlab{color:var(--accent)}
.hcell{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{display:flex;align-items:center;gap:6px;width:100%;min-height:30px;padding:4px 12px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;text-align:left;opacity:.45;transition:opacity .15s,background .15s}
.slot:hover,.slot:focus-visible{opacity:1;background:var(--cell)}
.dayline{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dayline .dayhead{margin-bottom:0;flex:1;width:auto;min-width:0}
.dayline .icon-btn{width:32px;height:32px;font-size:15px;background:var(--row)}
.dayline .icon-btn:hover{background:var(--soft)}

/* ---------- удаление записей ---------- */
.row{flex-wrap:wrap}
.rside{display:flex;align-items:center;gap:6px;align-self:flex-start}
.rdel{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted);font-size:15px;transition:background .15s,color .15s}
.rdel:hover,.rdel:focus-visible{background:var(--p3-bg);color:var(--p3-fg)}
.cfm{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0 2px 42px}

/* ---------- фильтр, список заказов ---------- */

/* ---------- подсветка дней, режимы ячеек ---------- */

/* ======= перенос невыполненных задач на следующий рабочий день (выходные: Сб, Вс) ======= */
function isWeekend(d){return S.cal.weekend.indexOf(wdOf(d))>=0;}
function nextWorkday(ds){var d=parse(ds),g=0;while(isWeekend(d)&&g++<14)d=addDays(d,1);return fmt(d);}
function isMoved(it,ds){return it.type==='task'&&it.rec&&it.rec.type==='none'&&!!it.origDate&&it.origDate!==ds;}
function rolloverNow(){
  items.forEach(function(it){if(it.type==='task'&&it.origDate&&it.origDate!==it.date){it.missedDates=it.missedDates||[];if(it.missedDates.indexOf(it.origDate)<0)it.missedDates.push(it.origDate);}});
  if(!S.tasks.rollover)return false;
  var ts=todayStr(), target=nextWorkday(ts), changed=false;
  items.forEach(function(it){
    if(it.type!=='task'||it.carry===false)return;
    if(!it.rec||it.rec.type!=='none')return;
    if(it.date>=ts)return;
    if(it.doneDates.indexOf(it.date)>=0)return;
    if(failedOn(it,it.date))return;
    if(!it.origDate)it.origDate=it.date;
    it.missedDates=it.missedDates||[];
    if(it.missedDates.indexOf(it.date)<0)it.missedDates.push(it.date);
    it.date=target;changed=true;
  });
  if(changed)persist();
  return changed;
}
/* Перенос дел не должен перебивать отметки с другого устройства: сначала синхронизируемся, потом переносим */
function syncStale(){
  try{
    var o=(typeof sync==='object'&&sync)?sync:JSON.parse((store&&store.getItem('planner.sync.v1'))||'null');
    if(!o||!o.on||!o.url||!o.key)return false;
    return Date.now()-(o.last||0)>90000;
  }catch(e){return false;}
}
var rollWait=false;
function rollover(){
  if(syncStale()){
    if(!rollWait){rollWait=true;setTimeout(function(){
      var fin=function(){rollWait=false;if(rolloverNow())renderAll();};
      Promise.resolve(doSync(true)).then(fin,fin);},400);}
    return false;
  }
  return rolloverNow();
}

/* ======= логика повторов ======= */
function occurs(it,ds){
  if(it.exDates&&it.exDates.indexOf(ds)>=0)return false;
  var r=it.rec;
  if(!r||r.type==='none')return it.date===ds||(it.type==='order'&&!!it.dueDate&&it.dueDate===ds);
  if(r.type==='dates')return r.dates.indexOf(ds)>=0;
  if(ds<it.date)return false;
  if(r.until&&ds>r.until)return false;
  var n=Math.max(1,r.interval||1), s=parse(it.date), d=parse(ds);
  if(r.type==='daily')return diffDays(it.date,ds)%n===0;
  if(r.type==='weekly'){
    var wds=(r.weekdays&&r.weekdays.length)?r.weekdays:[wdOf(s)];
    var mon=fmt(addDays(s,-wdOf(s)));
    var wk=Math.floor(diffDays(mon,ds)/7);
    return wk%n===0&&wds.indexOf(wdOf(d))>=0;
  }
  if(r.type==='monthly'){
    var months=(d.getFullYear()-s.getFullYear())*12+(d.getMonth()-s.getMonth());
    if(months%n!==0)return false;
    return d.getDate()===Math.min(s.getDate(),daysIn(d.getFullYear(),d.getMonth()));
  }
  if(r.type==='yearly'){
    return (d.getFullYear()-s.getFullYear())%n===0&&d.getMonth()===s.getMonth()&&d.getDate()===s.getDate();
  }
  return false;
}
function isOneOff(it){return !it.rec||it.rec.type==='none';}
function doneOn(it,ds){
  if(it.type==='order'&&isOneOff(it))return !!it.completed||it.doneDates.indexOf(it.date)>=0;
  return it.doneDates.indexOf(ds)>=0;
}
/* ✕ — «не выполнено, не переносить»: отдельное состояние, исключает «выполнено» */
function failedOn(it,ds){
  if(it.type==='order'&&isOneOff(it))return !!it.failed;
  return !!it.failedDates&&it.failedDates.indexOf(ds)>=0;
}
function setFailed(it,ds,f){
  if(it.type==='order'&&isOneOff(it)){it.failed=f;if(f){it.completed=false;it.doneDates=[];}return;}
  it.failedDates=it.failedDates||[];
  var i=it.failedDates.indexOf(ds);
  if(f){if(i<0)it.failedDates.push(ds);var k=it.doneDates.indexOf(ds);if(k>=0)it.doneDates.splice(k,1);}
  else if(i>=0)it.failedDates.splice(i,1);
}
function doneMode(){return S.tasks.doneDisplay;}
function cmp(a,b){
  var ta=a.time||'99:99', tb=b.time||'99:99', m=S.tasks.sort;
  if(m==='prio'&&a.prio!==b.prio)return b.prio-a.prio;
  if(m==='title'){var c=a.title.localeCompare(b.title,'ru');if(c)return c;}
  if(ta!==tb)return ta<tb?-1:1;
  if(a.prio!==b.prio)return b.prio-a.prio;
  return a.title.localeCompare(b.title,'ru');
}
function itemsOnAll(ds){return items.filter(function(it){return occurs(it,ds);});}
/* ручной порядок дня: сохранённые записи идут по списку, новые — в конец */
function applyOrder(ds,list){
  var o=dayOrder[ds];if(!o||!o.length)return list;
  var idx={};o.forEach(function(id,i){idx[id]=i;});
  return list.map(function(it,i){return {it:it,i:i};}).sort(function(a,b){
    var ia=idx[a.it.id],ib=idx[b.it.id];
    if(ia==null&&ib==null)return a.i-b.i;
    if(ia==null)return 1;if(ib==null)return -1;return ia-ib;
  }).map(function(x){return x.it;});
}
function itemsOn(ds){return applyOrder(ds,items.filter(function(it){return occurs(it,ds)&&(state.filter==='all'||it.type===state.filter);}).sort(cmp));}
function filterHtml(){
  return '<div class="filt" role="group" aria-label="Показывать">'+[['all','Все'],['task',TYPEP.task],['event',TYPEP.event],['order',TYPEP.order]].map(function(f){
    return '<button type="button" class="fbtn'+(state.filter===f[0]?' on':'')+'" data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(state.filter===f[0])+'">'+f[1]+'</button>';
  }).join('')+'</div>';
}
/* активные заказы: не выполненные; для повторяющихся — ближайшее невыполненное вхождение */
function activeOrderDate(it){
  if(!it.rec||it.rec.type==='none')return (doneOn(it,it.date)||failedOn(it,it.date))?null:it.date;
  var t=parse(todayStr());
  for(var i=0;i<400;i++){var ds=fmt(addDays(t,i));if(occurs(it,ds)&&!doneOn(it,ds)&&!failedOn(it,ds))return ds;}
  return null;
}
function activeOrders(){
  var res=[];
  items.forEach(function(it){if(it.type!=='order')return;var ds=activeOrderDate(it);if(ds)res.push({it:it,ds:ds});});
  function key(o){return (isOneOff(o.it)&&o.it.dueDate)?o.it.dueDate:o.ds;}
  res.sort(function(a,b){var ka=key(a),kb=key(b);return ka<kb?-1:ka>kb?1:cmp(a.it,b.it);});
  return res;
}

function saveForm(){
  var err=$('#err');
  var type=getRadio('type'), prio=Number(getRadio('prio'))||2, rep=$('#f-rep').value;
  var title=$('#f-title').value.trim(), client=$('#f-client').value.trim();
  var time=$('#f-time').value, end=type==='event'?$('#f-end').value:'';
  var date=$('#f-date').value;
  if(type!=='order'&&!title){err.textContent='Введите название.';$('#f-title').focus();return;}
  if(rep==='dates'){if(!fDates.length){err.textContent='Добавьте хотя бы одну дату.';return;}}
  else if(!date){err.textContent='Выберите дату.';return;}
  if(end&&time&&end<=time){err.textContent='Время окончания должно быть позже начала.';return;}
  var until=$('#f-until').value, gen=[];
  if(rep!=='none'&&rep!=='dates'&&until&&until<date){err.textContent='Дата окончания раньше начала.';return;}
  var due=$('#f-due').value;
  if(type==='order'&&rep==='none'&&due&&due<date){err.textContent='Срок не может быть раньше даты заказа.';return;}
  var oi=[];
  if(type==='order'){
    fOrder.forEach(function(o){if(String(o.name).trim())oi.push({name:String(o.name).trim(),qty:Math.max(1,parseInt(o.qty)||1)});});
    if(!oi.length){err.textContent='Добавьте хотя бы одну позицию в заказ.';return;}
    if(!title)title=client?'Заказ: '+client:(S.labels.kind[getRadio('okind')||'out']+' '+S.labels.type.order.toLowerCase());
  }
  var wds=[].slice.call(document.querySelectorAll('input[name="wd"]:checked')).map(function(c){return Number(c.value);});
  if(rep==='weekly'&&!wds.length&&date)wds=[wdOf(parse(date))];
  var rec={type:rep,interval:UNITS[rep]?Math.max(1,parseInt($('#f-int').value)||1):1,weekdays:rep==='weekly'?wds:[],dates:rep==='dates'?fDates.slice().sort():[],until:(rep==='none'||rep==='dates')?'':until};
  var itemDate=rep==='dates'?rec.dates[0]:date;
  var it={
    id:editing?editing.id:uid(),type:type,title:title,date:itemDate,time:time,endTime:end,prio:prio,
    notes:$('#f-notes').value.trim(),client:type==='order'?client:'',forSale:type==='order'?$('#f-sale').checked:false,
    orderItems:oi,rec:rec,doneDates:[],
    carry:(type==='task'&&rep==='none')?$('#f-carry').checked:false,
    orderKind:type==='order'?(getRadio('okind')||'out'):'',
    dueDate:(type==='order'&&rep==='none')?due:'',
    exDates:editing&&editing.exDates?editing.exDates.slice():[],
    missedDates:editing&&editing.missedDates?editing.missedDates.slice():[]
  };
  if(editing&&editing.origDate&&editing.date===itemDate&&type==='task'&&rep==='none')it.origDate=editing.origDate;
  if(editing){
    if(editing.demo)it.demo=false;
    if(rec.type==='none'){
      var was=editing.rec.type==='none'?doneOn(editing,editing.date):false;
      it.doneDates=was?[itemDate]:[];
    }else if(rec.type==='dates'){
      it.doneDates=editing.doneDates.filter(function(d){return rec.dates.indexOf(d)>=0;});
    }else{
      it.doneDates=editing.doneDates.slice();
    }
    var ef=editing.failedDates||[];
    if(rec.type==='none')it.failedDates=(editing.rec.type==='none'&&ef.indexOf(editing.date)>=0)?[itemDate]:[];
    else if(rec.type==='dates')it.failedDates=ef.filter(function(d){return rec.dates.indexOf(d)>=0;});
    else it.failedDates=ef.slice();
    it.failed=!!editing.failed&&type==='order'&&rec.type==='none';
    items=items.map(function(x){return x.id===editing.id?it:x;});
  }else{
    items.push(it);
    if(rep==='none'&&$('#f-tpl').checked)gen=genTasks(it);
  }
  persist();closeForm();
  if(rep!=='dates'&&(!editing||editing.date!==itemDate))selectDay(itemDate);else renderAll();
  if(gen.length)toast('Создано типовых задач: '+gen.length,gen);
}

/* ======= события ======= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act'), ds=el.getAttribute('data-date');
  switch(a){
    case 'toggle':{
      var it=items.filter(function(x){return x.id===el.getAttribute('data-id');})[0];
      if(!it)return;
      if(failedOn(it,ds)){setFailed(it,ds,false);persist();renderAll();break;}
      if(it.type==='order'&&isOneOff(it)){
        var nd=!doneOn(it,ds);it.completed=nd;it.doneDates=[];if(nd)it.failed=false;
        if(nd)state.pop=it.id+'|'+ds;
      }else{
        var i=it.doneDates.indexOf(ds);
        if(i>=0)it.doneDates.splice(i,1);else{it.doneDates.push(ds);state.pop=it.id+'|'+ds;setFailed(it,ds,false);}
      }
      persist();renderAll();break;
    }
    case 'edit':{
      var it2=items.filter(function(x){return x.id===el.getAttribute('data-id');})[0];
      if(it2)openForm(it2,ds);break;
    }
    case 'new':openForm(null,ds||state.selected,el.getAttribute('data-time')||'');break;
    case 'dayopen':openDay(ds);break;
    case 'del':state.del=el.getAttribute('data-id')+'|'+ds;renderAll();break;
    case 'delno':state.del='';renderAll();break;
    case 'fail':{
      var fit=items.filter(function(x){return x.id===el.getAttribute('data-id');})[0];
      if(fit){setFailed(fit,ds,true);persist();renderAll();}
      break;
    }
    case 'order-reset':delete dayOrder[ds];persistOrder();renderAll();break;
    case 'delone':{
      var did=el.getAttribute('data-id');
      items.forEach(function(x){if(x.id===did){x.exDates=x.exDates||[];if(x.exDates.indexOf(ds)<0)x.exDates.push(ds);}});
      state.del='';persist();renderAll();break;
    }
    case 'delall':{
      var aid=el.getAttribute('data-id');
      items=items.filter(function(x){return x.id!==aid;});
      state.del='';persist();renderAll();break;
    }
    case 'filter':state.filter=el.getAttribute('data-f');renderAll();break;
    case 'orders':if(!ordDlg.open)ordDlg.showModal();renderOrdDlg();break;
    case 'oclose':ordDlg.close();break;
    case 'okind':state.ordKind=el.getAttribute('data-k');renderOrdDlg();break;
    case 'new-order':openForm(null,todayStr());setRadio('type','order');if(state.ordKind!=='all')setRadio('okind',state.ordKind);syncForm();break;
    case 'dprev':selectDay(fmt(addDays(parse(state.selected),-1)));break;

    case 'dclose':dayDlg.close();break;

    case 'mode':state.mode=el.getAttribute('data-mode');renderPanel();break;
    case 'pprev':selectDay(fmt(addDays(parse(state.selected),state.mode==='day'?-1:-7)));break;
    case 'pnext':selectDay(fmt(addDays(parse(state.selected),state.mode==='day'?1:7)));break;
    case 'ptoday':case 'mtoday':selectDay(todayStr());break;
    case 'mprev':navCal(-1);break;
    case 'mnext':navCal(1);break;
    case 'close':closeForm();break;
    case 'orow-add':fOrder.push({name:'',qty:1});renderOrderRows(true);break;
    case 'orow-rm':fOrder.splice(Number(el.getAttribute('data-i')),1);if(!fOrder.length)fOrder.push({name:'',qty:1});renderOrderRows();break;
    case 'adddate':{
      var v=$('#f-adddate').value;
      if(v&&fDates.indexOf(v)<0){fDates.push(v);fDates.sort();renderDateChips();}
      $('#f-adddate').value='';break;
    }
    case 'rmdate':fDates=fDates.filter(function(d){return d!==ds;});renderDateChips();break;
    case 'theme':{
      S.theme=currentTheme()==='dark'?'light':'dark';
      saveSettings();applySettings();renderAll();if(state.view==='set')renderSettings();break;
    }
    case 'rmore':{var rw=el.closest('.row');if(rw)rw.classList.toggle('more');break;}
    case 'view':setView(el.getAttribute('data-v'));break;
    case 'sy-now':{sync.err='';if(!repoOK()||!sync.key){sync.err='Укажите репозиторий и токен';saveSync();renderSettings();break;}sync.on=true;saveSync();doSync(true);renderSettings();break;}
    case 'push-on':pushAct(pushOn);break;
    case 'push-off':pushAct(pushOff);break;
    case 'push-test':pushAct(pushTest);break;
    case 'brief-x':try{store&&store.setItem(BR_KEY,todayStr());}catch(er){}renderBrief();break;
    case 'tpl-add':case 'tpl-ex':case 'tpl-ask':case 'tpl-no':case 'tpl-del':case 'ttask-add':case 'ttask-del':case 'toast-undo':tplClick(a,el);break;

    case 'sdo':doData(el.getAttribute('data-k'));break;

    case 'demo-clear':
      items=items.filter(function(i){return !i.demo;});persist();renderAll();break;
  }

document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g||(e.pointerType==='mouse'&&e.button!==0))return;
  var row=g.closest('.row'),list=row&&row.parentElement;
  if(!list)return;
  e.preventDefault();
  var r=row.getBoundingClientRect(),ph=document.createElement('div');
  ph.className='row-ph';ph.style.height=r.height+'px';
  list.insertBefore(ph,row);
  row.classList.add('dragging');
  row.style.width=r.width+'px';row.style.left=r.left+'px';row.style.top=r.top+'px';
  document.body.classList.add('drag-on');
  dnd={row:row,list:list,ph:ph,dy:e.clientY-r.top,id:row.getAttribute('data-rid'),ds:state.selected};
});
window.addEventListener('pointermove',function(e){
  if(!dnd)return;
  dnd.row.style.top=(e.clientY-dnd.dy)+'px';
  var sibs=[].slice.call(dnd.list.children).filter(function(c){return c!==dnd.row&&c!==dnd.ph;}),before=null;
  for(var i=0;i<sibs.length;i++){var b=sibs[i].getBoundingClientRect();if(e.clientY<b.top+b.height/2){before=sibs[i];break;}}
  if(before!==dnd.ph.nextSibling)dnd.list.insertBefore(dnd.ph,before);
  var pn=$('#panel'),pr=pn.getBoundingClientRect();
  if(e.clientY<pr.top+40)pn.scrollTop-=12;else if(e.clientY>pr.bottom-40)pn.scrollTop+=12;
});
function endDrag(commit){
  if(!dnd)return;
  var d=dnd;dnd=null;
  document.body.classList.remove('drag-on');
  if(commit){
    var ids=[];
    [].slice.call(d.list.children).forEach(function(c){
      if(c===d.ph)ids.push(d.id);
      else if(c!==d.row&&c.classList.contains('row'))ids.push(c.getAttribute('data-rid'));
    });
    saveOpenOrder(d.ds,ids);
  }
  renderAll();
}
window.addEventListener('pointerup',function(){endDrag(true);});
window.addEventListener('pointercancel',function(){endDrag(false);});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&dnd){endDrag(false);return;}
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();
  var row=g.closest('.row'),list=row.parentElement,id=row.getAttribute('data-rid');
  var ids=[].slice.call(list.children).filter(function(c){return c.classList.contains('row');}).map(function(c){return c.getAttribute('data-rid');});
  var i=ids.indexOf(id),j=i+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=ids.length)return;
  ids.splice(i,1);ids.splice(j,0,id);
  saveOpenOrder(state.selected,ids);renderAll();
  var ng=document.querySelector('.row[data-rid="'+id+'"] .grip');if(ng)ng.focus();
});

function heatFor(ds){

  items.forEach(function(it){
    if(S.heat.scope==='task'&&it.type!=='task')return;
    if(occurs(it,ds)){tot++;if(doneOn(it,ds))dn++;}
    else if(it.missedDates&&it.missedDates.indexOf(ds)>=0)tot++;
  });
  if(!tot)return null;
  var pct=Math.round(dn/tot*100), c=null;
  for(var i=0;i<S.heat.bands.length;i++){if(pct>=S.heat.bands[i].min){c=S.heat.bands[i].color;break;}}
  return c?{pct:pct,color:c,tot:tot,dn:dn}:null;
}

function trackList(list,sigs,tomb,skipDemo){
  var now=syncNow(),seen={},ch=false;

    if(skipDemo&&it.demo)return;

  });
  Object.keys(sigs).forEach(function(id){if(!seen[id]){tomb[id]=now;delete sigs[id];ch=true;}});
  return ch;
}

  var seen={},list=(Array.isArray(d.items)?d.items:[]).map(function(x){return normItem(x,seen);}).filter(Boolean);

  var cur=items.filter(function(i){return !i.demo;});
  var changed=key(list)!==key(cur);
  var demo=(sync.last===0&&list.length)?[]:items.filter(function(i){return i.demo;});
  if(demo.length!==items.length-cur.length)changed=true;
  if(changed){
    items=demo.concat(list);
    sync.sigs={};list.forEach(function(it){sync.sigs[it.id]=rawSig(it);});
    sync.tomb=isObj(d.tomb)?d.tomb:{};

  }else if(isObj(d.tomb))sync.tomb=d.tomb;
  var tl=(Array.isArray(d.tpls)?d.tpls:[]).map(normTpl).filter(Boolean);
  var tkey=function(a){return JSON.stringify(a.slice().sort(function(p,q){return p.id<q.id?-1:1;}));};
  if(tkey(tl)!==tkey(tpls)){
    changed=true;tpls=tl;sync.tplTomb=isObj(d.tplTomb)?d.tplTomb:{};dedupSeedTpls();
    sync.tsigs={};tpls.forEach(function(t){sync.tsigs[t.id]=rawSig(t);});
    try{store&&store.setItem(TPL_KEY,JSON.stringify(tpls));}catch(e){}
  }else if(isObj(d.tplTomb))sync.tplTomb=d.tplTomb;
  if(isObj(d.notify)&&(d.nUpd||0)>sync.nUpd){
    S.notify=deepMerge(clone(DEFAULTS.notify),d.notify);sanitize(S,S);
    sync.nUpd=d.nUpd;sync.nSig=JSON.stringify(S.notify);
    try{store&&store.setItem(SET_KEY,JSON.stringify(S));}catch(e){}
    changed=true;
  }
  EXTRA.forEach(function(x){if(x.apply(d))changed=true;});
  return changed;
}
/* ---- обмен через GitHub: файлы в приватном репозитории с данными ---- */
function b64enc(str){var b=unescape(encodeURIComponent(str)),o='';for(var i=0;i<b.length;i+=30000)o+=btoa(b.slice(i,i+30000));return o;}
function b64dec(b){return decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));}
function repoOK(){return /^[\w.-]+\/[\w.-]+$/.test(sync.url);}
function ghErr(st){
  return st===401?'Токен не подошёл (неверный или истёк)':st===403?'Нет доступа или превышен лимит запросов GitHub':st===404?'Репозиторий не найден или у токена нет к нему доступа':'GitHub ответил: '+st;
}
function ghFetch(url,opt){var c=new AbortController(),t=setTimeout(function(){c.abort();},20000);opt=opt||{};opt.signal=c.signal;return fetch(url,opt).finally(function(){clearTimeout(t);});}
function ghHead(){return {'Authorization':'Bearer '+sync.key,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
async function ghGet(file){
  var r=await ghFetch('https://api.github.com/repos/'+sync.url+'/contents/'+file+'?t='+Date.now(),{headers:ghHead(),cache:'no-store'});
  try{var dh=r.headers.get('Date');if(dh){var sv=Date.parse(dh);if(sv)sync.skew=sv-Date.now();}}catch(e){}
  if(r.status===404)return null;
  if(!r.ok){var e=new Error(ghErr(r.status));e.http=r.status;throw e;}
  var j=await r.json(),txt;
  if(j.content&&j.encoding==='base64')txt=b64dec(j.content);
  else{var r2=await ghFetch('https://api.github.com/repos/'+sync.url+'/contents/'+file,{headers:Object.assign(ghHead(),{'Accept':'application/vnd.github.raw+json'}),cache:'no-store'});if(!r2.ok)throw new Error(ghErr(r2.status));txt=await r2.text();}
  var data=null;try{data=JSON.parse(txt);}catch(e){}
  return {sha:j.sha,data:data};
}
async function ghPut(file,obj,sha,msg){
  var body={message:msg||'planner',content:b64enc(JSON.stringify(obj))};if(sha)body.sha=sha;
  var r=await ghFetch('https://api.github.com/repos/'+sync.url+'/contents/'+file,{method:'PUT',headers:Object.assign(ghHead(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return 'conflict';
  if(!r.ok){var e=new Error(ghErr(r.status));e.http=r.status;throw e;}
  return 'ok';
}
async function ghMutate(file,fn,msg){ /* прочитать → изменить → записать, с повтором при конфликте */
  for(var k=0;k<4;k++){
    var cur=await ghGet(file),nv=fn(cur?cur.data:null);
    if(nv===undefined)return true;
    if(await ghPut(file,nv,cur&&cur.sha,msg)==='ok')return true;
  }
  throw new Error('Не удалось записать файл '+file+': конфликт, попробуйте ещё раз');
}
function mergeById(server,client,sTomb,cTomb){
  var tomb={},k;
  for(k in sTomb||{})tomb[k]=sTomb[k];
  for(k in cTomb||{})if((cTomb[k]||0)>(tomb[k]||0))tomb[k]=cTomb[k];
  var out={};for(k in server||{})out[k]=server[k];
  (Array.isArray(client)?client:[]).forEach(function(r){
    if(!isObj(r)||typeof r.id!=='string'||r.id.length>60)return;
    var o=out[r.id];if(!o||(r.upd||0)>(o.upd||0))out[r.id]=r;
  });
  Object.keys(out).forEach(function(id){if(tomb[id]&&tomb[id]>=(out[id].upd||0))delete out[id];});
  var lim=Date.now()-120*864e5;for(k in tomb)if(tomb[k]<lim)delete tomb[k];
  return {map:out,tomb:tomb};
}
function cleanSched(a){return (Array.isArray(a)?a:[]).slice(0,500).map(function(e){return {id:String(e.id).slice(0,80),t:Math.round(e.t),title:String(e.title).slice(0,120),body:String(e.body||'').slice(0,200)};});}
function doSync(force){
  if(syncP)return syncP;
  syncP=doSyncInner(force).then(function(){syncP=null;},function(){syncP=null;});
  return syncP;
}
async function doSyncInner(force){
  if((!sync.on&&!force)||sync.busy)return;
  syncDirty=false;
  if(!repoOK()){sync.err='Укажите репозиторий в виде «владелец/имя»';saveSync();return;}
  if(sync.key.length<16){sync.err='Токен слишком короткий';saveSync();return;}
  sync.busy=true;var changed=false;
  try{
    var merged=null;
    for(var attempt=0;attempt<4&&!merged;attempt++){
      var cur=await ghGet('data.json'),doc=(cur&&isObj(cur.data))?cur.data:{items:{},tomb:{},tpls:{},tplTomb:{},notify:null,nUpd:0};
      var a=mergeById(doc.items,items.filter(function(i){return !i.demo;}),doc.tomb,sync.tomb);
      var b=mergeById(doc.tpls,tpls,doc.tplTomb,sync.tplTomb);
      var notify=doc.notify,nUpd=doc.nUpd||0;
      if(isObj(S.notify)&&(sync.nUpd||0)>nUpd){notify=S.notify;nUpd=sync.nUpd;}
      var nd=Object.assign({},doc,{items:a.map,tomb:a.tomb,tpls:b.map,tplTomb:b.tomb,notify:notify,nUpd:nUpd});
      EXTRA.forEach(function(x){x.merge(doc,nd);});
      if(JSON.stringify(nd)===JSON.stringify(doc)||(await ghPut('data.json',nd,cur&&cur.sha,'planner sync'))==='ok')merged=nd;
    }
    if(!merged)throw new Error('Конфликт записи, попробуйте ещё раз');
    changed=applyMerged(Object.assign({},merged,{items:Object.keys(merged.items).map(function(k){return merged.items[k];}),
      tpls:Object.keys(merged.tpls).map(function(k){return merged.tpls[k];})}));
    /* расписание уведомлений для отправщика */
    var sch=buildSched(),now=Date.now();
    (sync.tests||[]).forEach(function(t){if(t>now-3600000)sch.push({id:'test-'+t,t:t,title:'Планер',body:'Проверка: уведомления работают'});});
    sync.tests=(sync.tests||[]).filter(function(t){return t>now-3600000;});
    var sig=JSON.stringify(sch.filter(function(e){return e.t>now||e.id.indexOf('test-')===0;}));
    if(sig!==sync.schSig){
      await ghMutate('sched.json',function(){return {sched:cleanSched(sch),by:Date.now()};},'planner schedule');
      sync.schSig=sig;
    }
    sync.last=Date.now();sync.err='';
  }catch(e){
    sync.err=(e&&e.name!=='AbortError'&&e.message&&e.message!=='Failed to fetch'&&e.message!=='Load failed')?e.message:'Нет связи с GitHub';
  }
  sync.busy=false;saveSync();
  if(changed){renderAll();if(state.view==='tpl')renderTpl();}
  if(state.view==='set')renderSettings();
  if(changed&&!syncAgain){syncAgain=true;await doSyncInner();syncAgain=false;}
  else if(syncDirty&&sync.on&&!syncAgain)setTimeout(function(){doSync();},300);
}
setInterval(function(){if(sync.on&&!document.hidden)doSync();},30000);
setTimeout(function(){if(sync.on)doSync();},400);
document.addEventListener('visibilitychange',function(){if(!sync.on)return;if(!document.hidden)doSync();else if(syncDirty){clearTimeout(syncTimer);doSync();}});
window.addEventListener('online',function(){if(sync.on)doSync();});

/* ======= расписание уведомлений (его выкладывает любое устройство при синхронизации) ======= */
function localT(ds,tm){var p=ds.split('-'),q=tm.split(':');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]),Number(q[0]),Number(q[1])).getTime();}
function pl(n,a,b,c){var m=n%100,k=n%10;return (m>10&&m<15)?c:k===1?a:(k>=2&&k<=4)?b:c;}
function typeOn(it){var N=S.notify;return it.type==='task'?N.typeTask:it.type==='event'?N.typeEvent:N.typeOrder;}
function liveList(ds,flags){
  return itemsOnAll(ds).filter(function(it){
    if(doneOn(it,ds)||failedOn(it,ds))return false;
    return flags?typeOn(it):true;
  }).sort(cmp);
}
function leadTxt(m){return m>=60?'Через '+(m/60)+' ч':'Через '+m+' мин';}
function buildSched(){
  var N=S.notify,out=[],now=Date.now(),ts=todayStr();
  if(!N.remind&&!N.sum)return out;
  var nw=nextWorkday(fmt(addDays(parse(ts),1)));
  for(var k=0;k<N.days;k++){
    var dd=addDays(parse(ts),k),ds=fmt(dd),d8=ds.replace(/-/g,''),list=liveList(ds,true);
    if(N.remind)list.forEach(function(it){
      var due=(it.type==='order'&&it.dueDate===ds&&isOneOff(it))?' · срок заказа':'';
      if(it.time){
        var t=localT(ds,it.time)-N.leadMin*60000;
        if(t>now-15*60000)out.push({id:it.id+'-'+d8+'r',t:t,title:it.title,body:(N.leadMin?leadTxt(N.leadMin)+' · ':'Сейчас · ')+it.time+due});
      }else if(N.untimedOn){
        var t2=localT(ds,N.untimed);
        if(t2>now-15*60000)out.push({id:it.id+'-'+d8+'u',t:t2,title:it.title,body:(due?'Срок заказа сегодня':'Дело на сегодня')});
      }
    });
    if(N.sum&&(N.sumWeekend||!isWeekend(dd))){
      var sl=list.slice();
      if(ds===nw&&S.tasks.rollover){
        var have={};sl.forEach(function(i){have[i.id]=1;});
        items.forEach(function(it){
          if(it.type==='task'&&typeOn(it)&&isOneOff(it)&&it.carry!==false&&it.date<=ts&&!have[it.id]&&!doneOn(it,it.date)&&!failedOn(it,it.date))sl.push(it);
        });
        sl.sort(cmp);
      }
      var ts2=localT(ds,N.sumTime);
      if(ts2>now-15*60000&&(sl.length||N.sumEmpty)){
        out.push({id:'sum-'+d8,t:ts2,title:sl.length?'Сегодня: '+sl.length+' '+pl(sl.length,'дело','дела','дел'):'Сегодня дел нет',
          body:sl.slice(0,3).map(function(i){return i.title;}).join(', ')+(sl.length>3?' и ещё '+(sl.length-3):'')});
      }
    }
  }
  out.sort(function(a,b){return a.t-b.t;});
  return out.slice(0,400);
}

/* ======= сводка при открытии ======= */
var BR_KEY='planner.brief.v1';
function renderBrief(){
  var el=$('#brief');if(!el)return;
  var ts=todayStr(),dis=false;
  try{dis=!!store&&store.getItem(BR_KEY)===ts;}catch(e){}
  var list=liveList(ts,false);
  if(!S.notify.brief||dis||state.view!=='cal'||!list.length){el.classList.add('hide');return;}
  el.innerHTML='<div class="bh"><b>Сегодня: '+list.length+' '+pl(list.length,'дело','дела','дел')+'</b><button type="button" class="icon-btn mini" data-act="brief-x" aria-label="Скрыть сводку">'+icon('x',13)+'</button></div><ul>'+
    list.slice(0,3).map(function(it){return '<li>'+(it.time?'<span class="bt2">'+esc(it.time)+'</span>':'')+esc(it.title)+'</li>';}).join('')+
    (list.length>3?'<li class="more2">и ещё '+(list.length-3)+'</li>':'')+'</ul>';
  el.classList.remove('hide');
}

/* ======= push на этом устройстве ======= */
function pushOK(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https?:$/.test(location.protocol);}
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);}
function u8(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function pushStatus(){
  if(!pushOK()){state.pushSt='na';return;}
  if(!isStandalone()&&/iPhone|iPad/.test(navigator.userAgent)){state.pushSt='home';return;}
  if(Notification.permission==='denied'){state.pushSt='denied';return;}
  try{var reg=await navigator.serviceWorker.getRegistration();var sub=reg&&await reg.pushManager.getSubscription();state.pushSt=(sub&&Notification.permission==='granted')?'on':'off';}
  catch(e){state.pushSt='off';}
}
async function pushOn(){
  try{
    if(!repoOK()||sync.key.length<16){state.smsg='Сначала укажите репозиторий и токен синхронизации.';return;}
    var vp=await ghGet('vapid.json');
    if(!vp||!vp.data||!vp.data.pub){state.smsg='Сервер уведомлений ещё не запускался: откройте в репозитории планера Actions → «Уведомления планера» → Run workflow и повторите через минуту.';return;}
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){state.smsg='Уведомления не разрешены. Разрешите их в настройках iPhone: Настройки → Уведомления → Планер.';return;}
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(vp.data.pub)});
    var js=sub.toJSON();
    await ghMutate('subs.json',function(d){
      var list=(d&&Array.isArray(d.subs)?d.subs:[]).filter(function(x){return x.endpoint!==js.endpoint;});
      list.push({endpoint:js.endpoint,keys:{p256dh:js.keys.p256dh,auth:js.keys.auth}});
      return {subs:list.slice(-5)};
    },'planner device');
    state.smsg='Уведомления включены на этом устройстве.';
    sync.on=true;saveSync();doSync();
  }catch(e){state.smsg='Не получилось: '+(e&&e.message||e);}
}
async function pushOff(){
  try{
    var reg=await navigator.serviceWorker.getRegistration(),sub=reg&&await reg.pushManager.getSubscription();
    if(sub){var ep=sub.endpoint;await ghMutate('subs.json',function(d){return {subs:(d&&Array.isArray(d.subs)?d.subs:[]).filter(function(x){return x.endpoint!==ep;})};},'planner device off');await sub.unsubscribe();}
    state.smsg='Уведомления на этом устройстве выключены.';
  }catch(e){state.smsg='Не получилось: '+(e&&e.message||e);}
}
async function pushTest(){
  try{
    sync.tests=(sync.tests||[]).concat([Date.now()]);sync.schSig='';saveSync();
    await doSync(true);
    state.smsg=sync.err?('Ошибка: '+sync.err):'Проверка поставлена в очередь: уведомление придёт в течение 5–10 минут.';
  }catch(e){state.smsg='Не получилось: '+(e&&e.message||e);}
}
async function pushAct(fn){await fn();await pushStatus();renderSettings();}

function syncSection(){
  return '<section class="sg"><h2>Синхронизация</h2><p class="sdesc">Планер на компьютере и на телефоне обмениваются записями через приватный репозиторий GitHub. На всех устройствах укажите один и тот же репозиторий и токен.</p>'+
    row('Репозиторий с данными','<input type="text" class="wide" data-sy="url" placeholder="владелец/planner-data" value="'+esc(sync.url)+'" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Репозиторий с данными">','Приватный, например anna/planner-data')+
    row('Токен доступа','<input type="password" class="wide" data-sy="key" placeholder="github_pat_…" value="'+esc(sync.key)+'" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Токен доступа GitHub">','Доступ только к этому репозиторию')+
    row('Передать на другое устройство',(repoOK()&&sync.key?'<input type="text" class="wide" readonly data-sy-copy value="'+esc(sync.url+' '+sync.key)+'" aria-label="Строка для другого устройства">':'<span class="sdesc" style="margin:0">Сначала заполните репозиторий и токен</span>'),'Скопируйте эту строку')+
    row('Вставить строку с другого устройства','<input type="text" class="wide" data-sy="paste" placeholder="репозиторий и токен через пробел" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Строка с другого устройства">')+
    row('Синхронизировать','<label class="tgl"><input type="checkbox" data-sy="on" aria-label="Синхронизация включена"'+(sync.on?' checked':'')+'><span class="sw"></span></label>')+
    '<div class="sbtns"><button type="button" class="btn btn-primary btn-sm" data-act="sy-now">Синхронизировать сейчас</button></div>'+
    (sync.err?'<p class="smsg bad" role="status">Ошибка: '+esc(sync.err)+'</p>':(sync.last?'<p class="sdesc">Последняя синхронизация: '+fmtClock(sync.last)+'</p>':''))+
    '</section>';
}
function notifySection(){
  var N=S.notify,st=state.pushSt,dev='';
  if(pushOK()){
    var txt={on:'Включены на этом устройстве',off:'Не включены',denied:'Запрещены в настройках iPhone',home:'Сначала добавьте планер на экран «Домой» и откройте его оттуда',na:''}[st]||'Не включены';
    dev=row('На этом устройстве',txt?'<span class="sdesc" style="margin:0">'+txt+'</span>':'')+

        :(st==='home'||st==='denied'?'':'<button type="button" class="btn btn-primary btn-sm" data-act="push-on">Включить уведомления</button>'))+'</div>';
  }else dev='<p class="sdesc">Уведомления приходят на телефон: откройте планер на iPhone с экрана «Домой». Настройки ниже общие для всех устройств.</p>';
  return '<section class="sg"><h2>Уведомления</h2>'+dev+
    (state.smsg&&state.view==='set'?'<p class="smsg" role="status">'+esc(state.smsg)+'</p>':'')+
    tgl('notify.remind','Напоминать о делах')+
    row('За сколько до начала',sel('notify.leadMin',[[0,'В момент начала'],[5,'За 5 минут'],[10,'За 10 минут'],[15,'За 15 минут'],[30,'За 30 минут'],[60,'За 1 час'],[120,'За 2 часа']]))+
    tgl('notify.untimedOn','Дела без времени')+
    row('Напомнить в','<input type="time" class="tin" data-set="notify.untimed" data-vt="str" value="'+N.untimed+'" aria-label="Время напоминания">')+
    tgl('notify.typeTask',TYPEP.task)+tgl('notify.typeEvent',TYPEP.event)+tgl('notify.typeOrder',TYPEP.order)+
    tgl('notify.sum','Ежедневная сводка','Одно короткое уведомление утром')+
    row('Время сводки','<input type="time" class="tin" data-set="notify.sumTime" data-vt="str" value="'+N.sumTime+'" aria-label="Время сводки">')+
    tgl('notify.sumWeekend','Сводка по выходным')+tgl('notify.sumEmpty','Сводка, если дел нет')+
    row('Планировать на дней вперёд',sel('notify.days',[[7,'7 дней'],[14,'14 дней'],[30,'30 дней'],[60,'60 дней']]))+
    tgl('notify.brief','Сводка при открытии планера')+'</section>';
}

/* ======= жесты и офлайн ======= */
function navCal(n){if(state.cm)shiftMonth(n);else selectDay(fmt(addDays(parse(state.selected),7*n)));}
(function(){
  var cal=document.querySelector('.cal'),x0=0,y0=0,t0=0;
  cal.addEventListener('touchstart',function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  cal.addEventListener('touchend',function(e){
    var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Date.now()-t0<600&&Math.abs(dx)>55&&Math.abs(dy)<40)navCal(dx<0?1:-1);
  },{passive:true});
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js');}catch(e){}
})();

/* ======= старт ======= */
buildStatic();
pushStatus();
state.ctheme=currentTheme();
applySettings();
renderAll();
